# Alternativa a Caddy. Luego: sudo certbot --nginx -d teranga.tudominio.com
server {
  listen 80;
  server_name teranga.tudominio.com;
  root /opt/teranga-pay/public;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss://relay.damus.io wss://nos.lol; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location / { try_files $uri /index.html; }
}
